name: Set Flowrates

metadata:
  author: Tobias Ginsburg, Doga Ozgulbas
  info: Sets flowrates for beamline experiment
  version: 0.2

parameters:
  json_inputs:
    - key: target_flowrate_1
    - key: target_flowrate_2
    - key: target_flowrate_3
    - key: target_flowrate_4

steps:
  - name: Set Flowrate 2
    action: set_setpoint_and_settle
    node: sierra_mfc_2
    use_parameters:
      args:
        setpoint: target_flowrate_2
  - name: Set Flowrate 3
    action: set_setpoint_and_settle
    node: sierra_mfc_3
    use_parameters:
      args:
        setpoint: target_flowrate_3
  - name: Set Flowrate 4
    action: set_setpoint_and_settle
    node: sierra_mfc_4
    use_parameters:
      args:
        setpoint: target_flowrate_4
  - name: Set Flowrate 1
    action: set_setpoint_and_settle
    node: sierra_mfc_1
    use_parameters:
      args:
        setpoint: target_flowrate_1